name: Build Nebula Cinematic

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP project tidak ditemukan!"
            exit 1
          fi
          mkdir project
          unzip -q "$ZIP_FILE" -d project

      - name: Build Plugin
        run: |
          BUILD_FILE=$(find project -name build.gradle.kts -o -name build.gradle | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "File Gradle tidak ditemukan!"
            exit 1
          fi
          BUILD_DIR=$(dirname "$BUILD_FILE")
          cd "$BUILD_DIR"
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NebulaCinematic
          path: project/**/build/libs/*.jar
